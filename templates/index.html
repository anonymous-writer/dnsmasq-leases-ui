<!doctype html>
<html lang="en">
<head>
  <!-- Dokument-Metadaten: UTF-8, mobile Darstellung und Theme-Unterstützung. -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>dnsmasq-leases-ui</title>
  <!-- Das Icon wird statisch vom Webserver aus /static ausgeliefert. -->
  <link rel="icon" type="image/svg+xml" href="/static/icon.svg">
  <style>
:root {
  --bg:#fff;
  --fg:#111;
  --row:#e6e6e6;
  --muted:#666;
  --border:#ccc;
  --accent:#06c
}
/* Wenn kein Theme explizit gewählt wurde, Systemeinstellung für Dunkelmodus nutzen. */
@media(prefers-color-scheme:dark) {
  :root:not([data-theme=light]) {
    --bg:#1a1a1a;
    --fg:#e6e6e6;
    --row:#2a2a2a;
    --muted:#999;
    --border:#444;
    --accent:#4d9fff
  }
}
/* Explizit aktiviertes dunkles Theme. Die Werte entsprechen dem Dark-Mode-Teil oben. */
:root[data-theme=dark] {
  --bg:#1a1a1a;
  --fg:#e6e6e6;
  --row:#2a2a2a;
  --muted:#999;
  --border:#444;
  --accent:#4d9fff
}
/* Grundlayout der gesamten Seite. */
body {
  font-family:system-ui,sans-serif;
  background:var(--bg);
  color:var(--fg);
  margin:1rem
}
/* Werkzeugleiste mit Suche, Filtern und Aktionsbuttons. */
#toolbar {
  position:sticky;
  top:0;
  background:var(--bg);
  padding:.5rem 0;
  display:flex;
  gap:.5rem;
  z-index:2
}
/* Suchfeld: max-width begrenzt die Breite auf großen Bildschirmen. */
#search {
  max-width:24rem;
  flex:1;
  padding:.4rem .6rem;
  font:inherit;
  color:var(--fg);
  background:var(--bg);
  border:1px solid var(--border);
  border-radius:4px
}
/* Dropdowns für IP-Version und DHCP-Reservierungsfilter. */
#ip-filter,#reservation-filter {
  padding:.4rem .5rem;
  font:inherit;
  color:var(--fg);
  background:var(--bg);
  border:1px solid var(--border);
  border-radius:4px;
  max-width:100%
}
/* Buttons zum Zurücksetzen und zum Merken reservierter Geräte. */
#reset-known-button,#mark-reservations-button {
  padding:.4rem .7rem;
  font:inherit;
  background:var(--bg);
  color:var(--fg);
  border:1px solid var(--border);
  border-radius:4px;
  cursor:pointer
}
#reset-known-button:disabled,#mark-reservations-button:disabled {
  opacity:.6;
  cursor:wait
}
/* Manuelles Aktualisieren der Lease-Liste. */
#refresh-button {
  padding:.4rem .7rem;
  font:inherit;
  background:var(--bg);
  color:var(--fg);
  border:1px solid var(--border);
  border-radius:4px;
  cursor:pointer
}
#refresh-button:disabled {
  opacity:.6;
  cursor:wait
}
/* Runder Umschalter für helles/dunkles Theme. */
#theme-toggle {
  margin-left:auto;
  border:1px solid var(--fg);
  background:var(--bg);
  color:var(--fg);
  border-radius:50%;
  width:2.25rem;
  height:2.25rem;
  cursor:pointer
}
.icon-sun {
  display:none
}
:root[data-theme=dark] .icon-moon {
  display:none
}
:root[data-theme=dark] .icon-sun {
  display:inline
}
/* Tabelle und Spaltenüberschriften. */
table {
  border-collapse:collapse;
  width:100%
}
th,td {
  text-align:left;
  padding:.5rem;
  border-bottom:1px solid var(--border)
}
th {
  position:sticky;
  top:3.2rem;
  background:var(--bg);
  cursor:pointer
}
tbody tr:hover {
  background:var(--row)
}
a {
  color:var(--accent)
}
/* Statuszeile unter der Tabelle; bei Fehlern kommt zusätzlich .error dazu. */
#status {
  margin-top:.75rem;
  color:var(--muted)
}
#status.error {
  color:#c00
}
/* Versions-/Release-Information am Seitenende. */
footer {
  margin-top:1rem;
  color:var(--muted);
  font-size:.9rem
}
/* Tabellenzeilen, die durch app.js anklickbar gemacht werden. */
tr.device-row {
  cursor:pointer
}
tr.new-device {
  background:#fff0cc
}
:root[data-theme=dark] tr.new-device {
  background:#493b20
}
/* Kennzeichnung für neue Geräte. */
.new-badge {
  display:inline-block;
  background:#b45309;
  color:#fff;
  font-size:.7rem;
  font-weight:700;
  padding:.12rem .35rem;
  border-radius:4px;
  letter-spacing:.03em
}
/* Statusspalte und farbige Statuspunkte. */
.device-status {
  white-space:nowrap;
  font-weight:600
}
.dot {
  display:inline-block;
  width:.55rem;
  height:.55rem;
  border-radius:50%;
  margin-right:.35rem;
  background:#888
}
.dot.online {
  background:#159447
}
.dot.reachable {
  background:#d9a400
}
.dot.offline {
  background:#c33
}
.dot.unknown {
  background:#888
}
/* Modal für die Gerätedetails. */
dialog {
  max-width:min(38rem,calc(100vw - 3rem));
  width:100%;
  border:1px solid var(--border);
  border-radius:10px;
  background:var(--bg);
  color:var(--fg)
}
dialog::backdrop {
  background:#0008
}
/* Responsive Anordnung der Informationen im Detaildialog. */
.detail-grid {
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(10rem,1fr));
  gap:.8rem
}
.detail-item {
  padding:.65rem;
  border:1px solid var(--border);
  border-radius:6px;
  overflow-wrap:anywhere
}
/* Kopierbuttons innerhalb der Gerätedetails. */
.copy-button {
  display:block;
  margin-top:.45rem;
  padding:.2rem .45rem;
  font:inherit;
  font-size:.8rem;
  background:var(--bg);
  color:var(--fg);
  border:1px solid var(--border);
  border-radius:4px;
  cursor:pointer
}
.detail-label {
  display:block;
  color:var(--muted);
  font-size:.8rem;
  margin-bottom:.2rem
}
#detail-close {
  float:right;
  padding:.4rem .7rem;
  background:var(--bg);
  color:var(--fg);
  border:1px solid var(--border);
  border-radius:5px;
  cursor:pointer
}
  </style></head><body>
  <!--
    Hauptwerkzeugleiste.
    Wichtig: IDs werden von /static/app.js verwendet. Beim Umbenennen einer ID
    muss deshalb auch die Referenz in app.js angepasst werden.
  -->
  <div id="toolbar">
    <!-- Freitextsuche über geladene DHCP-Leases. -->
    <input id="search" type="search" placeholder="Filter leases…"
           aria-label="Filter leases" autocomplete="off">

    <!-- Einschränkung auf IPv4, IPv6 oder alle IP-Versionen. -->
    <select id="ip-filter" aria-label="Filter IP version" title="Filter IPv4/IPv6">
      <option value="all">All IPs</option>
      <option value="ipv4">IPv4</option>
      <option value="ipv6">IPv6</option>
    </select>

    <!-- Filtert die Ansicht nach DHCP-Reservierungen oder dynamischen Leases. -->
    <select id="reservation-filter" aria-label="Filter DHCP reservations" title="Filter DHCP reservations">
      <option value="all">All leases</option>
      <option value="reserved">Reservations</option>
      <option value="dynamic">Dynamic only</option>
    </select>

    <!-- Refresh wird in app.js verdrahtet; es ist kein automatischer Polling-Timer. -->
    <button id="refresh-button" type="button" title="Refresh leases" aria-label="Refresh leases">↻ Refresh</button>

    <!-- Merkt alle aktuell erkannten DHCP-Reservierungen mit gültiger MAC-Adresse. -->
    <button id="mark-reservations-button" type="button" title="Mark all DHCP reservations as known">Mark reservations known</button>

    <!-- Entfernt nach Bestätigung alle dauerhaft gespeicherten Merkeinträge. -->
    <button id="reset-known-button" type="button" title="Forget all remembered devices">Reset remembered</button>

    <!-- Theme-Umschalter: app.js setzt das Theme; CSS zeigt jeweils das passende Symbol. -->
    <button id="theme-toggle" type="button" aria-label="Toggle dark mode">
      <svg class="icon-moon" viewBox="0 0 24 24" width="20" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
      </svg>
      <svg class="icon-sun" viewBox="0 0 24 24" width="20" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <circle cx="12" cy="12" r="4"/>
        <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
      </svg>
    </button>
  </div>

  <!--
    Lease-Tabelle. app.js fügt die Zeilen zur Laufzeit in tbody ein und behandelt
    Sortierung/Klicks. data-key muss zu den Feldnamen in der API passen.
  -->
  <table id="leases">
    <thead>
      <tr>
        <th data-key="status">Status<span class="sort-indicator"></span></th>
        <th data-key="ipAddress">IP Address<span class="sort-indicator"></span></th>
        <th data-key="macAddress">Mac Address<span class="sort-indicator"></span></th>
        <th data-key="name">Name<span class="sort-indicator"></span></th>
        <th data-key="staticIP">DHCP Reservation<span class="sort-indicator"></span></th>
        <th data-key="leasetime">Lease ends on<span class="sort-indicator"></span></th>
      </tr>
    </thead>
    <!-- Bleibt leer, bis app.js Lease-Daten von /leases geladen hat. -->
    <tbody></tbody>
  </table>

  <!-- Meldungen zum Ladezustand oder zu Fehlern werden von app.js gesetzt. -->
  <div id="status">Loading…</div>

  <!-- Modal: app.js befüllt #detail-content mit den gewählten Gerätedetails. -->
  <dialog id="device-details" aria-labelledby="detail-title">
    <button id="detail-close" type="button">Close</button>
    <h2 id="detail-title">Device details</h2>
    <div id="detail-content" class="detail-grid"></div>
  </dialog>

  <!--
    Go-Template-Variablen: .RepoURL, .Version und .ReleaseDate werden serverseitig
    eingesetzt. Diese Platzhalter nicht entfernen, wenn die Datei als Go-Template
    verwendet wird.
  -->
  <footer>
    <a href="{{.RepoURL}}" target="_blank" rel="noopener noreferrer">dnsmasq-leases-ui</a>
    v{{.Version}}{{if .ReleaseDate}} · released {{.ReleaseDate}}{{end}}
  </footer>

  <!-- Cache-Busting: Versionswert ändert die URL, wenn ein neues App-Build geladen wird. -->
  <script src="/static/app.js?v={{.Version}}"></script>
</body>
</html>
