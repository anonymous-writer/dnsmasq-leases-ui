<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><title>dnsmasq-leases-ui</title><link rel="icon" type="image/svg+xml" href="/static/icon.svg"><style>
:root{--bg:#fff;--fg:#111;--row:#e6e6e6;--muted:#666;--border:#ccc;--accent:#06c}@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#1a1a1a;--fg:#e6e6e6;--row:#2a2a2a;--muted:#999;--border:#444;--accent:#4d9fff}}:root[data-theme=dark]{--bg:#1a1a1a;--fg:#e6e6e6;--row:#2a2a2a;--muted:#999;--border:#444;--accent:#4d9fff}body{font-family:system-ui,sans-serif;background:var(--bg);color:var(--fg);margin:1rem}#toolbar{position:sticky;top:0;background:var(--bg);padding:.5rem 0;display:flex;gap:.5rem;z-index:2}#search{max-width:24rem;flex:1;padding:.4rem .6rem;font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--border);border-radius:4px}#theme-toggle{margin-left:auto;border:1px solid var(--fg);background:var(--bg);color:var(--fg);border-radius:50%;width:2.25rem;height:2.25rem;cursor:pointer}.icon-sun{display:none}:root[data-theme=dark] .icon-moon{display:none}:root[data-theme=dark] .icon-sun{display:inline}table{border-collapse:collapse;width:100%}th,td{text-align:left;padding:.5rem;border-bottom:1px solid var(--border)}th{position:sticky;top:3.2rem;background:var(--bg);cursor:pointer}tbody tr:hover{background:var(--row)}a{color:var(--accent)}#status{margin-top:.75rem;color:var(--muted)}#status.error{color:#c00}footer{margin-top:1rem;color:var(--muted);font-size:.9rem}tr.device-row{cursor:pointer} .device-status{white-space:nowrap;font-weight:600}.dot{display:inline-block;width:.55rem;height:.55rem;border-radius:50%;margin-right:.35rem;background:#888}.dot.online{background:#159447}.dot.reachable{background:#d9a400}.dot.offline{background:#c33}.dot.unknown{background:#888}dialog{max-width:min(38rem,calc(100vw - 3rem));width:100%;border:1px solid var(--border);border-radius:10px;background:var(--bg);color:var(--fg)}dialog::backdrop{background:#0008}.detail-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(10rem,1fr));gap:.8rem}.detail-item{padding:.65rem;border:1px solid var(--border);border-radius:6px;overflow-wrap:anywhere}.detail-label{display:block;color:var(--muted);font-size:.8rem;margin-bottom:.2rem}#detail-close{float:right;padding:.4rem .7rem;background:var(--bg);color:var(--fg);border:1px solid var(--border);border-radius:5px;cursor:pointer}</style></head><body>
<div id="toolbar"><input id="search" type="search" placeholder="Filter leases…" aria-label="Filter leases" autocomplete="off"><button id="theme-toggle" type="button" aria-label="Toggle dark mode"><svg class="icon-moon" viewBox="0 0 24 24" width="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg><svg class="icon-sun" viewBox="0 0 24 24" width="20" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg></button></div>
<table id="leases"><thead><tr><th data-key="status">Status<span class="sort-indicator"></span></th><th data-key="ipAddress">IP Address<span class="sort-indicator"></span></th><th data-key="macAddress">Mac Address<span class="sort-indicator"></span></th><th data-key="name">Name<span class="sort-indicator"></span></th><th data-key="staticIP">DHCP Reservation<span class="sort-indicator"></span></th><th data-key="leasetime">Lease ends on<span class="sort-indicator"></span></th></tr></thead><tbody></tbody></table><div id="status">Loading…</div>
<dialog id="device-details" aria-labelledby="detail-title"><button id="detail-close" type="button">Close</button><h2 id="detail-title">Device details</h2><div id="detail-content" class="detail-grid"></div></dialog>
<footer><a href="{{.RepoURL}}" target="_blank" rel="noopener noreferrer">dnsmasq-leases-ui</a> v{{.Version}}{{if .ReleaseDate}} · released {{.ReleaseDate}}{{end}}</footer><script src="/static/app.js?v={{.Version}}"></script></body></html>
