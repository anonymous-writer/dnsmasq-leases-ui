# Dependabot hält Go-Abhängigkeiten, GitHub Actions und Docker-Basisimages aktuell.
# Datei ablegen unter: .github/dependabot.yml

version: 2
updates:
  # Go-Module aus go.mod / go.sum
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 10
    groups:
      go-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Versionen der in .github/workflows verwendeten Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:15"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 10
    groups:
      github-actions:
        patterns:
          - "*"

  # Versionsupdates für Images, die im Dockerfile referenziert sind
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:30"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 10
